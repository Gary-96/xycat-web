# ==============================================================================
# xycat.com — aaPanel 原生 Nginx 静态站点配置（参考完整版）
# ==============================================================================
# 适用：aaPanel（宝塔国际版）+ 纯静态 Astro 构建产物（dist/）
#
# 使用方式（二选一）：
#   A. 推荐：只用下面的「CUSTOM BLOCK」段落，粘贴进 aaPanel 已生成的 vhost，
#      保留面板的 SSL-START/END、REWRITE-START 等标记，否则面板会覆盖你的改动。
#   B. 整份替换：需要自行填入证书路径，并确认 aaPanel 的 SSL 自动续期仍然生效。
#
# 站点根目录：/www/wwwroot/xycat.com   （内容为 dist/ 里的文件，不是 dist 目录本身）
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name xycat.com www.xycat.com;

    # ACME 验证目录必须放行，否则证书续期会失败
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/xycat.com;
        default_type "text/plain";
        allow all;
    }

    # 其余请求全部跳 HTTPS（与 www -> 主域合并为一次跳转）
    location / {
        return 301 https://xycat.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name xycat.com www.xycat.com;

    root /www/wwwroot/xycat.com;
    index index.html;
    charset utf-8;

    # ---- 证书（aaPanel 申请后会自动写入，整份替换时改为实际路径）----
    # ssl_certificate     /www/server/panel/vhost/cert/xycat.com/fullchain.pem;
    # ssl_certificate_key /www/server/panel/vhost/cert/xycat.com/privkey.pem;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    # ssl_prefer_server_ciphers off;
    # ssl_session_cache   shared:SSL:10m;
    # ssl_session_timeout 1d;

    # ---- www 统一跳主域（canonical 是 https://xycat.com）----
    if ($host = www.xycat.com) {
        return 301 https://xycat.com$request_uri;
    }

    access_log /www/wwwlogs/xycat.com.log;
    error_log  /www/wwwlogs/xycat.com.error.log;

    # ==========================================================================
    # CUSTOM BLOCK START —— 以下为本站自定义配置，可整段粘贴进 aaPanel 的 vhost
    # ==========================================================================

    # ---- 路由解析 ----
    # Astro 输出 directory 格式（/about/ -> /about/index.html）。
    # $uri/ 命中目录时 nginx 会自动 301 到带斜杠的规范地址，与 canonical 一致。
    # 找不到就交给 error_page 返回真正的 404 状态码（不要 fallback 到 200）。
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # ---- 带内容哈希的构建产物：强缓存一年 ----
    location ^~ /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ---- 图片与字体：30 天缓存 ----
    location ~* \.(?:avif|webp|png|jpe?g|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ---- HTML 不缓存，保证改版后立即生效 ----
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # ---- 压缩 ----
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # ---- 安全响应头 ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # CSP 先以 Report-Only 观察一周，确认无阻断后再改为强制模式：
    # add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://api.web3forms.com; form-action 'self' https://api.web3forms.com; frame-ancestors 'none'; base-uri 'self'" always;

    # ---- 屏蔽隐藏文件（保留 .well-known）----
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ==========================================================================
    # CUSTOM BLOCK END
    # ==========================================================================
}
